<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a cozy reading nook with a stack of books, a lamp, and a plant">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8362"/>
      <stop offset="100%" stop-color="#152b21"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dca8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0dca8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="380" rx="24" fill="url(#bgGrad)"/>

  <!-- lamp glow -->
  <ellipse cx="120" cy="130" rx="130" ry="120" fill="url(#lampGlow)"/>

  <!-- floor line -->
  <rect x="24" y="318" width="512" height="4" rx="2" fill="#f8f4ec" opacity="0.14"/>

  <!-- window -->
  <g opacity="0.5">
    <rect x="40" y="40" width="120" height="150" rx="6" fill="none" stroke="#f8f4ec" stroke-width="3"/>
    <line x1="100" y1="40" x2="100" y2="190" stroke="#f8f4ec" stroke-width="3"/>
    <line x1="40" y1="115" x2="160" y2="115" stroke="#f8f4ec" stroke-width="3"/>
  </g>

  <!-- floor lamp -->
  <g>
    <line x1="118" y1="330" x2="118" y2="150" stroke="#e8dcc0" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 150 L148 150 L138 108 L98 108 Z" fill="#f0dca8"/>
    <ellipse cx="118" cy="330" rx="26" ry="6" fill="#0e1f18" opacity="0.35"/>
  </g>

  <!-- armchair -->
  <g>
    <rect x="200" y="230" width="150" height="90" rx="18" fill="#3f6d50"/>
    <rect x="188" y="200" width="24" height="120" rx="12" fill="#356044"/>
    <rect x="338" y="200" width="24" height="120" rx="12" fill="#356044"/>
    <rect x="196" y="188" width="158" height="46" rx="16" fill="#4f8362"/>
    <ellipse cx="275" cy="322" rx="90" ry="10" fill="#0e1f18" opacity="0.25"/>
  </g>

  <!-- side table -->
  <g>
    <rect x="380" y="252" width="70" height="10" rx="4" fill="#e8dcc0"/>
    <rect x="392" y="262" width="8" height="56" fill="#e8dcc0"/>
    <rect x="430" y="262" width="8" height="56" fill="#e8dcc0"/>
  </g>

  <!-- stack of books on side table -->
  <g>
    <rect x="384" y="228" width="62" height="16" rx="2" fill="#c9a15a"/>
    <rect x="388" y="212" width="54" height="16" rx="2" fill="#f8f4ec"/>
    <rect x="392" y="196" width="46" height="16" rx="2" fill="#7a9e8e"/>
  </g>

  <!-- open book / plant on the floor -->
  <g>
    <path d="M470 320 C470 300 480 280 480 262 C480 280 490 300 490 320 Z" fill="#7a9e8e"/>
    <path d="M462 320 C458 300 460 278 452 262 C462 276 470 296 470 320 Z" fill="#4f8362"/>
    <path d="M498 320 C502 300 500 278 508 262 C498 276 490 296 490 320 Z" fill="#4f8362"/>
    <rect x="450" y="318" width="60" height="14" rx="4" fill="#c9a15a"/>
  </g>

  <!-- small stack of books bottom left -->
  <g>
    <rect x="40" y="300" width="80" height="18" rx="2" fill="#a65c5c"/>
    <rect x="46" y="282" width="68" height="18" rx="2" fill="#f8f4ec"/>
    <rect x="52" y="264" width="56" height="18" rx="2" fill="#c9a15a"/>
  </g>
</svg>
